name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm test
      - name: Install pinned Ratchet CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RATCHET_VERSION: v0.6.3
        run: bash .github/scripts/install-ratchet.sh
      - name: Validate gates
        id: ratchet
        env:
          RATCHET_NO_UPDATE_CHECK: '1'
        run: ratchet check --config=ratchet.config.jsonc --tier=fast
      - name: Render the report
        if: always() && steps.ratchet.outcome == 'success'
        shell: bash
        run: 'ratchet report --format md >> "$GITHUB_STEP_SUMMARY"'
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan repository for leaked secrets
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner'
